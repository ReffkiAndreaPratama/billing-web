name: billing_pro_mobile
description: Billing Pro — Mobile monitoring & management for gaming centers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Monospace
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
